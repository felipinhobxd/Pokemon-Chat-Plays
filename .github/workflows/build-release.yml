name: Build e Release - Pokemon Chat Plays

on:
  push:
    tags:
      - 'v*'  # dispara quando uma tag v* é criada (ex: git tag v2.1.0)
  workflow_dispatch:  # permite rodar manualmente

# Permissoes necessarias para criar releases e subir artefatos
permissions:
  contents: write
  packages: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Rodar testes
        run: npm test

  build-windows:
    needs: testar
    runs-on: windows-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar pkg (empacotador)
        run: npm install -g pkg

      - name: Empacotar em .exe
        run: pkg . --targets node18-win-x64 --output PokemonChatPlays.exe --compress GZip

      - name: Criar pasta de release
        run: |
          mkdir release
          copy PokemonChatPlays.exe release\
          copy .env.example release\
          copy README.md release\
          copy iniciar.bat release\
          copy LICENSE release\

      - name: Criar ZIP
        run: |
          cd release
          7z a -tzip PokemonChatPlays-Windows.zip *

      - name: Extrair versao da tag
        id: versao
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $env:GITHUB_OUTPUT

      - name: Criar Release no GitHub (com tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/PokemonChatPlays-Windows.zip
          name: Pokemon Chat Plays ${{ steps.versao.outputs.VERSION }}
          body: |
            # Pokemon Chat Plays ${{ steps.versao.outputs.VERSION }} - SindromeGames Edition

            ## Como usar (plug-and-play)

            1. Baixe e descompacte o arquivo `PokemonChatPlays-Windows.zip`.
            2. Edite o arquivo `.env` (abra com o Bloco de Notas) e preencha com suas credenciais da Twitch/YouTube.
               - Token da Twitch: https://twitchtokengenerator.com/ (pode colar com ou sem o prefixo oauth:)
               - API Key do YouTube: https://console.cloud.google.com/ (ative a YouTube Data API v3)
            3. De um duplo-clique em `iniciar.bat`.
            4. Abra o emulador (VisualBoyAdvance-M) e deixe em foco.
            5. Pronto! O chat da sua live ja controla o jogo.

            ## Comandos suportados

            | Comando | Acao |
            |---------|------|
            | a, b, l, r, start, select | Botoes do controle |
            | up, down, left, right | Setas |
            | cima, baixo, esquerda, direita | Setas (PT) |
            | hold cima / hold baixo 3 / hold up 500ms | SEGURA a tecla por um tempo (novo!) |
            | segurar cima, segura baixo | Segurar em portugues |
            | soltar | Solta todas as teclas presas |
            | !comandos | Lista COMPLETA no chat (bonita e organizada) |
            | !stats / !top | Estatisticas e ranking dos jogadores |

            ## Suporte
            - Twitch: https://twitch.tv/sindromegames
            - YouTube: https://youtube.com/@SindromeGames
            - Issues: https://github.com/felipinhobxd/Pokemon-Chat-Plays/issues
          draft: false
          prerelease: false

      - name: Upload do artefato (sem tag)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PokemonChatPlays-Windows
          path: release/PokemonChatPlays-Windows.zip
          retention-days: 30
