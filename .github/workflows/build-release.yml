name: Build and Release - ChatPlays

on:
  push:
    tags:
      - 'v*'  # dispara quando uma tag v* é criada (ex: git tag v2.1.0)
  workflow_dispatch:  # permite rodar manualmente

# Permissões MÍNIMAS por job (v2.8.1): o job de testes só precisa ler; só o
# job de release (que cria a Release no GitHub) precisa escrever. O antigo
# `packages: write` global não era usado por nada — removido.
permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-windows:
    needs: testar
    runs-on: windows-latest
    permissions:
      contents: write  # necessário APENAS para criar a Release (softprops/action-gh-release)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install pkg (packager)
        run: npm install -g pkg

      - name: Package the .exe
        run: pkg . --targets node18-win-x64 --output ChatPlays.exe --compress GZip

      - name: Extract version from package.json
        id: versao_pkg
        shell: bash
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Assemble release folder
        run: |
          mkdir release
          copy ChatPlays.exe release\
          copy .env.example release\
          copy README.md release\
          copy iniciar.bat release\
          copy LICENSE release\

      - name: Build the NSIS installer
        shell: pwsh
        run: |
          # Resolve o makensis: PATH > caminho padrao do choco > instala
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidato = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $candidato) {
              $makensis = $candidato
            } else {
              Write-Host "NSIS nao encontrado — instalando via chocolatey..."
              choco install nsis -y --no-progress
              if (Test-Path $candidato) { $makensis = $candidato }
            }
          }
          if (-not $makensis) { throw "makensis nao disponivel" }
          $exe = if ($makensis -is [string]) { $makensis } else { $makensis.Source }
          & $exe -DVERSION="${{ steps.versao_pkg.outputs.VERSION }}" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falhou (exit $LASTEXITCODE)" }
          if (-not (Test-Path "ChatPlays-Setup.exe")) { throw "instalador nao foi gerado" }
          copy ChatPlays-Setup.exe release\

      - name: Create the portable ZIP
        run: |
          cd release
          7z a -tzip ChatPlays-Windows.zip ChatPlays.exe .env.example README.md iniciar.bat LICENSE

      - name: Extract version from tag
        id: versao
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ChatPlays-Setup.exe
            release/ChatPlays-Windows.zip
          name: ChatPlays ${{ steps.versao.outputs.VERSION }}
          body: |
            ## ChatPlays ${{ steps.versao.outputs.VERSION }}

            ### ChatPlays rebrand

            Pokemon Chat Plays is now **ChatPlays**, reflecting support for almost any keyboard-driven game.

            * Renamed application, installer, executable, portable archive, documentation and GitHub-facing branding.
            * New assets:
              * `ChatPlays-Setup.exe`
              * `ChatPlays-Windows.zip`
            * Existing Pokemon Chat Plays installations upgrade in place.
            * Legacy install information and executable fallback are intentionally preserved for compatibility.
            * The updater now uses the new `felipinhobxd/ChatPlays` repository directly.

            ### Reliability fixes

            * Fixed a keyboard queue edge case that could discard a hold `keyup` and leave a game key stuck under heavy chat load.
            * Improved overlay shutdown by closing persistent browser/OBS connections.
            * Hardened `.env` generation against pasted CR/LF characters.
            * Added runtime user data and temporary secret files to `.gitignore`.
            * Improved regression-test cleanup so failed overlay tests cannot hang the suite.

            ### Validation

            * 292 automated tests
            * 0 npm audit vulnerabilities
            * Windows build validated
          draft: false
          prerelease: false

      - name: Upload artifact (no tag)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ChatPlays-Windows
          path: release/ChatPlays-Windows.zip
          retention-days: 30
