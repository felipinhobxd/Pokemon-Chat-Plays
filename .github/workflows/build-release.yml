name: Build and Release - ChatPlays

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release_meta.outputs.SHA }}
      tag: ${{ steps.release_meta.outputs.TAG }}
      version: ${{ steps.release_meta.outputs.VERSION }}
      do_release: ${{ steps.release_meta.outputs.DO_RELEASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          SHA="${GITHUB_SHA}"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          DO_RELEASE=false

          if [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then
            TAG="${GITHUB_REF#refs/heads/release/}"
            VERSION="${TAG#v}"
            DO_RELEASE=true

            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            if [[ "${MAIN_SHA}" != "${GITHUB_SHA}" ]]; then
              echo "main changed after the release branch was created; refusing to release blindly."
              echo "release branch: ${GITHUB_SHA}"
              echo "current main:    ${MAIN_SHA}"
              exit 1
            fi

            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists; refusing to overwrite it."
              exit 1
            fi

            git checkout -B __chatplays_release origin/main
            npm version "${VERSION}" --no-git-tag-version

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "release: ChatPlays ${TAG}"

            SHA="$(git rev-parse HEAD)"
            git push origin HEAD:main
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            DO_RELEASE=true
          fi

          echo "SHA=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "DO_RELEASE=${DO_RELEASE}" >> "${GITHUB_OUTPUT}"

  testar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

  build-windows:
    needs: [preparar, testar]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preparar.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pkg (packager)
        run: npm install -g pkg

      - name: Package the .exe
        run: pkg . --targets node18-win-x64 --output ChatPlays.exe --compress GZip

      - name: Assemble release folder
        run: |
          mkdir release
          copy ChatPlays.exe release\
          copy .env.example release\
          copy README.md release\
          copy iniciar.bat release\
          copy LICENSE release\

      - name: Build the NSIS installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidato = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $candidato) {
              $makensis = $candidato
            } else {
              Write-Host "NSIS nao encontrado - instalando via chocolatey..."
              choco install nsis -y --no-progress
              if (Test-Path $candidato) { $makensis = $candidato }
            }
          }
          if (-not $makensis) { throw "makensis nao disponivel" }
          $exe = if ($makensis -is [string]) { $makensis } else { $makensis.Source }
          & $exe -DVERSION="${{ needs.preparar.outputs.version }}" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falhou (exit $LASTEXITCODE)" }
          if (-not (Test-Path "ChatPlays-Setup.exe")) { throw "instalador nao foi gerado" }
          copy ChatPlays-Setup.exe release\

      - name: Create the portable ZIP
        run: |
          cd release
          7z a -tzip ChatPlays-Windows.zip ChatPlays.exe .env.example README.md iniciar.bat LICENSE

      - name: Create GitHub Release
        if: needs.preparar.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preparar.outputs.tag }}
          target_commitish: ${{ needs.preparar.outputs.sha }}
          name: ChatPlays ${{ needs.preparar.outputs.tag }}
          files: |
            release/ChatPlays-Setup.exe
            release/ChatPlays-Windows.zip
          body: |
            ## ChatPlays ${{ needs.preparar.outputs.tag }}

            ### Fixes

            * Fixed `save` / `salvar` occasionally being interpreted as Load in Windows window mode.
            * Added fail-safe savestate handling: if ChatPlays cannot confirm a safe save, it sends nothing instead of risking a Load.
            * Protects older configurations where Save and Load were accidentally mapped to the same function key.
            * Portuguese and English game controls remain interchangeable (`cima`/`up`, `direita`/`right`, etc.).
            * Improved `!comandos` so the command list reflects the PT-BR/EN aliases that actually work.

            ### Validation

            * Automated test suite passed.
            * `npm audit` passed.
            * Windows executable, installer and portable ZIP built in GitHub Actions.
          draft: false
          prerelease: false

      - name: Upload artifact (manual build)
        if: needs.preparar.outputs.do_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChatPlays-Windows
          path: release/ChatPlays-Windows.zip
          retention-days: 30
