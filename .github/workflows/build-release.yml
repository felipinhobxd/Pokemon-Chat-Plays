name: Build e Release - Pokemon Chat Plays

on:
  push:
    tags:
      - 'v*'  # dispara quando uma tag v* é criada (ex: git tag v2.1.0)
  workflow_dispatch:  # permite rodar manualmente

# Permissões MÍNIMAS por job (v2.8.1): o job de testes só precisa ler; só o
# job de release (que cria a Release no GitHub) precisa escrever. O antigo
# `packages: write` global não era usado por nada — removido.
permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Rodar testes
        run: npm test

  build-windows:
    needs: testar
    runs-on: windows-latest
    permissions:
      contents: write  # necessário APENAS para criar a Release (softprops/action-gh-release)
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar pkg (empacotador)
        run: npm install -g pkg

      - name: Empacotar em .exe
        run: pkg . --targets node18-win-x64 --output PokemonChatPlays.exe --compress GZip

      - name: Extrair versao do package.json
        id: versao_pkg
        shell: bash
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Criar pasta de release
        run: |
          mkdir release
          copy PokemonChatPlays.exe release\
          copy .env.example release\
          copy README.md release\
          copy iniciar.bat release\
          copy LICENSE release\

      - name: Compilar instalador setup.exe (NSIS)
        shell: pwsh
        run: |
          # Resolve o makensis: PATH > caminho padrao do choco > instala
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidato = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $candidato) {
              $makensis = $candidato
            } else {
              Write-Host "NSIS nao encontrado — instalando via chocolatey..."
              choco install nsis -y --no-progress
              if (Test-Path $candidato) { $makensis = $candidato }
            }
          }
          if (-not $makensis) { throw "makensis nao disponivel" }
          $exe = if ($makensis -is [string]) { $makensis } else { $makensis.Source }
          & $exe -DVERSION="${{ steps.versao_pkg.outputs.VERSION }}" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falhou (exit $LASTEXITCODE)" }
          if (-not (Test-Path "PokemonChatPlays-Setup.exe")) { throw "instalador nao foi gerado" }
          copy PokemonChatPlays-Setup.exe release\

      - name: Criar ZIP
        run: |
          cd release
          7z a -tzip PokemonChatPlays-Windows.zip PokemonChatPlays.exe .env.example README.md iniciar.bat LICENSE

      - name: Extrair versao da tag
        id: versao
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Criar Release no GitHub (com tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PokemonChatPlays-Setup.exe
            release/PokemonChatPlays-Windows.zip
          name: Pokemon Chat Plays ${{ steps.versao.outputs.VERSION }}
          body: |
            # Pokemon Chat Plays ${{ steps.versao.outputs.VERSION }} - SindromeGames Edition

            ## Como usar (plug-and-play)

            1. Baixe e execute o `PokemonChatPlays-Setup.exe` — instala com atalhos no Menu Iniciar e desinstalador (não pede administrador).
               - Alternativa portátil: baixe o `PokemonChatPlays-Windows.zip` e descompacte.
            2. Na primeira execução, o assistente de configuração abre no seu navegador: ligue a Twitch/YouTube, cole suas credenciais e o link da live — e teste a conexão antes de salvar.
               - Token da Twitch: https://twitchtokengenerator.com/ (pode colar com ou sem o prefixo oauth:)
               - API Key do YouTube: https://console.cloud.google.com/ (ative a YouTube Data API v3)
            3. Abra o emulador (VisualBoyAdvance-M) e deixe em foco.
            4. Pronto! O chat da sua live ja controla o jogo.

            ## Comandos suportados

            | Comando | Acao |
            |---------|------|
            | a, b, l, r, start, select | Botoes do controle |
            | up, down, left, right | Setas |
            | cima, baixo, esquerda, direita | Setas (PT) |
            | hold cima / hold baixo 3 / hold up 500ms | SEGURA a tecla por um tempo (novo!) |
            | segurar cima, segura baixo | Segurar em portugues |
            | soltar | Solta todas as teclas presas |
            | !comandos | Lista COMPLETA no chat (bonita e organizada) |
            | !stats / !top | Estatisticas e ranking dos jogadores |

            ## Suporte
            - Twitch: https://twitch.tv/sindromegames
            - YouTube: https://youtube.com/@SindromeGames
            - Issues: https://github.com/felipinhobxd/Pokemon-Chat-Plays/issues
          draft: false
          prerelease: false

      - name: Upload do artefato (sem tag)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PokemonChatPlays-Windows
          path: release/PokemonChatPlays-Windows.zip
          retention-days: 30
