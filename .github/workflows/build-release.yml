name: Build and Release - ChatPlays

on:
  push:
    tags:
      - 'v*'  # dispara quando uma tag v* é criada (ex: git tag v2.1.0)
  workflow_dispatch:  # permite rodar manualmente

# Permissões MÍNIMAS por job (v2.8.1): o job de testes só precisa ler; só o
# job de release (que cria a Release no GitHub) precisa escrever. O antigo
# `packages: write` global não era usado por nada — removido.
permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-windows:
    needs: testar
    runs-on: windows-latest
    permissions:
      contents: write  # necessário APENAS para criar a Release (softprops/action-gh-release)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install pkg (packager)
        run: npm install -g pkg

      - name: Package the .exe
        run: pkg . --targets node18-win-x64 --output ChatPlays.exe --compress GZip

      - name: Extract version from package.json
        id: versao_pkg
        shell: bash
        run: echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Assemble release folder
        run: |
          mkdir release
          copy ChatPlays.exe release\
          copy .env.example release\
          copy README.md release\
          copy iniciar.bat release\
          copy LICENSE release\

      - name: Build the NSIS installer
        shell: pwsh
        run: |
          # Resolve o makensis: PATH > caminho padrao do choco > instala
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidato = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (Test-Path $candidato) {
              $makensis = $candidato
            } else {
              Write-Host "NSIS nao encontrado — instalando via chocolatey..."
              choco install nsis -y --no-progress
              if (Test-Path $candidato) { $makensis = $candidato }
            }
          }
          if (-not $makensis) { throw "makensis nao disponivel" }
          $exe = if ($makensis -is [string]) { $makensis } else { $makensis.Source }
          & $exe -DVERSION="${{ steps.versao_pkg.outputs.VERSION }}" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis falhou (exit $LASTEXITCODE)" }
          if (-not (Test-Path "ChatPlays-Setup.exe")) { throw "instalador nao foi gerado" }
          copy ChatPlays-Setup.exe release\

      - name: Create the portable ZIP
        run: |
          cd release
          7z a -tzip ChatPlays-Windows.zip ChatPlays.exe .env.example README.md iniciar.bat LICENSE

      - name: Extract version from tag
        id: versao
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ChatPlays-Setup.exe
            release/ChatPlays-Windows.zip
          name: ChatPlays ${{ steps.versao.outputs.VERSION }}
          body: |
            # ChatPlays ${{ steps.versao.outputs.VERSION }} — SindromeGames Edition

            Let your Twitch and YouTube chat control almost any keyboard-driven game — Pokémon on an emulator, Minecraft, whatever — the classic Twitch Plays experience on your own stream.

            ## Fully Customizable Chat Controls

            This release turns chat commands into a configurable system — new games and new actions need **zero code changes**:

            - **Remap built-in controls** — point any action at any keyboard key.
            - **Add custom actions for any game** — each control is *action → keyboard key → chat aliases*.
            - **Keyboard key capture** in the setup wizard — press a key and it fills in automatically.
            - **Automatic PT-BR + English alias suggestions** (`space` → `space`, `espaco`, `barra de espaco`; `up` → `up`, `cima`) — and every alias stays fully editable.
            - **Twitch and YouTube share one control registry** — configure once, both chats can play.
            - **Dynamic `!commands` and announcements** — the chat always sees the controls that actually exist.
            - **Presets are now optional starting templates** (VBA-M, mGBA, DeSmuME, RetroArch) — apply one, then customize freely.
            - **Persistent custom controls** in `dados/controles.json` — they survive restarts and reinstalls.
            - **Backward compatible** — existing `.env` / `TECLA_*` configurations keep working unchanged.

            ### Minecraft in two minutes

            In the wizard's 🎮 Chat Controls section:

            | Action | Key | Chat aliases |
            |--------|-----|--------------|
            | Jump | Space | `jump`, `space`, `pular`, `espaco` |
            | Inventory | E | `inventory`, `inventario`, `e` |
            | Crouch | Shift | `crouch`, `agachar`, `shift` |

            Save, and both chats can use them immediately: `!commands` lists them, democracy mode accepts them as votes, and the OBS overlay shows your action names.

            ## Reliability improvements carried from v2.8.1

            - Hardened local setup-wizard security (host validation, CSRF protection, masked secrets).
            - CI now runs the full test suite on every push and pull request.
            - Fixed the YouTube scheduled-live retry timer.
            - Atomic persistence for stats and configuration files.

            ## Getting started

            1. Download and run **`ChatPlays-Setup.exe`** — installs per-user (no admin required), with Start-menu shortcuts and an uninstaller. *Portable alternative: `ChatPlays-Windows.zip`.*
               - Upgrading from an older *Pokemon Chat Plays* install? The installer upgrades it in place — no duplicate install, and old shortcuts are cleaned up automatically.
            2. On every start, the setup wizard opens in your browser, pre-filled with what you saved before: enable Twitch and/or YouTube, paste your credentials and the live URL, and **test each connection** before saving.
               - Twitch token: https://twitchtokengenerator.com/ (with or without the `oauth:` prefix)
               - YouTube API key: https://console.cloud.google.com/ (enable YouTube Data API v3)
            3. Set your game: paste the path of any executable (emulator, Minecraft, whatever) and the ROM if there is one — the bot launches it, sends keys straight to its window (you stay free in OBS), and reopens it automatically if it closes mid-stream.
            4. That's it — your chat is playing.

            ## Support
            - Twitch: https://twitch.tv/sindromegames
            - YouTube: https://youtube.com/@SindromeGames
            - Issues: https://github.com/felipinhobxd/ChatPlays/issues
          draft: false
          prerelease: false

      - name: Upload artifact (no tag)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ChatPlays-Windows
          path: release/ChatPlays-Windows.zip
          retention-days: 30
