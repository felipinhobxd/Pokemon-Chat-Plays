name: Implement Minecraft launcher automation

on:
  push:
    branches:
      - feat/minecraft-launcher-automation
    paths:
      - .github/workflows/implement-minecraft-launcher.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm

      - name: Apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          # Runtime + wizard edits are in the stable first section of the patch.
          head -n 363 scripts/patch-minecraft-launcher-automation.py > /tmp/patch-core.py
          python3 -m py_compile /tmp/patch-core.py
          python3 /tmp/patch-core.py

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              '.env.example',
              r'''# Serve QUALQUER programa: VBA-M, mGBA, RetroArch, DeSmuME, Minecraft...
          # Deixe VAZIO para o bot perguntar no terminal ao iniciar (o caminho
          # fica salvo em dados/emulador.json — Enter mantém o último usado).
          # EMULADOR_EXE=C:\Emuladores\visualboyadvance-m.exe''',
              r'''# Serve qualquer jogo/emulador. Para Minecraft Java, configure
          # EMULADOR_PRESET=minecraft e coloque aqui o LAUNCHER. O ATLauncher é
          # automatizado: o bot abre/reutiliza, entra em Instances e aperta Play.
          # Deixe VAZIO para o bot perguntar no terminal ao iniciar.
          # EMULADOR_EXE=C:\Users\Admin\AppData\Roaming\ATLauncher\ATLauncher.exe'''
          )

          replace_once(
              'README.md',
              '- **Any game, any emulator** — paste the path of ANY executable (VBA-M, mGBA, RetroArch, even Minecraft): the bot **opens it with the ROM**, and if the game closes mid-stream it **reopens it automatically** with the same ROM (crash-loop safe: 5 instant-crashes → gives up and warns).',
              '- **Any game, any emulator — plus Minecraft launchers** — normal games/emulators use their `.exe`; for Minecraft Java, select the Minecraft preset and paste the launcher path. **ATLauncher is automated**: ChatPlays opens/reuses it, goes to **Instances → Play**, then watches the real Java/Minecraft process and can relaunch it after a crash.'
          )
          replace_once(
              'README.md',
              "3. In the wizard's **🎮 Game / Emulator** card, paste the game executable path (any program works) and, for emulators, the **ROM path** — the bot verifies both and can even **launch the game** for you.",
              r'''3. In **🎮 Game / Emulator**, paste the game/emulator executable. For **Minecraft Java**, choose the Minecraft preset and paste the launcher path (example: `C:\Users\Admin\AppData\Roaming\ATLauncher\ATLauncher.exe`). ATLauncher is opened/reused and ChatPlays drives **Instances → Play** automatically.'''
          )
          replace_once(
              'README.md',
              '- **On boot** — game not running? The bot opens it: `spawn(exe, [ROM, ...args])`. Already running? It just **attaches** (no second instance) and watches it.',
              '- **On boot** — normal games use `spawn(exe, [ROM, ...args])`. With the Minecraft preset + ATLauncher, the configured `.exe` is a **launcher**: ChatPlays opens/reuses ATLauncher and triggers **Instances → Play**, while the watchdog tracks the real Java/Minecraft process instead of the launcher.'
          )
          replace_once(
              'README.md',
              '- **Watchdog** — the game closes mid-stream → the bot waits `JOGO_REINICIAR_DELAY_MS` (3 s) and **reopens it with the same ROM**. The OBS overlay shows 🎮 running / 🔄 reopening live.',
              '- **Watchdog** — the game closes mid-stream → the bot waits `JOGO_REINICIAR_DELAY_MS` (3 s) and reopens it. Minecraft gets a startup grace period while Java loads; the launcher staying open does **not** count as the game running.'
          )
          replace_once(
              'README.md',
              r'''It works with anything you can launch: `EMULADOR_EXE=C:\Emuladores\visualboyadvance-m.exe` + `JOGO_ROM=C:\Games\Pokemon - Emerald.gba`, a launcher `.bat`, a `.jar`… For extra flags (RetroArch cores etc.) use `JOGO_ARGS`.''',
              r'''It works with anything you can launch: `EMULADOR_EXE=C:\Emuladores\visualboyadvance-m.exe` + `JOGO_ROM=C:\Games\Pokemon - Emerald.gba`. Minecraft Java is special: use `EMULADOR_PRESET=minecraft` + an ATLauncher path. See [Minecraft + ATLauncher](docs/MINECRAFT-ATLAUNCHER.md). For extra flags (RetroArch cores etc.) use `JOGO_ARGS`.'''
          )

          p = Path('src/tests/minecraft-preset.test.js')
          s = p.read_text(encoding='utf-8')
          old = "test('assistente Minecraft configura o mouse global e persiste o preset correto', () => {\n  assert.match(PAGINA, /if \\(sel === \"minecraft\"\\)/);\n  assert.match(PAGINA, /f-modo-mouse/);"
          new = "test('assistente Minecraft configura teclado e mouse globais e persiste o preset correto', () => {\n  assert.match(PAGINA, /if \\(sel === \"minecraft\"\\)/);\n  assert.match(PAGINA, /f-modo-teclado/);\n  assert.match(PAGINA, /f-modo-mouse/);"
          if old not in s:
              raise SystemExit('minecraft preset test pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          docs = Path('docs/MINECRAFT-ATLAUNCHER.md')
          docs.write_text(r'''# Minecraft + ATLauncher

          For Minecraft Java there is no stable game `.exe` to save in ChatPlays. Configure the **Minecraft** control preset and put the launcher path in `EMULADOR_EXE`, for example:

          ```text
          C:\Users\Admin\AppData\Roaming\ATLauncher\ATLauncher.exe
          ```

          On Windows, ChatPlays now:

          1. opens or reuses ATLauncher;
          2. tries Windows UI Automation to select **Instances**;
          3. opens **Instances** and presses **Play**;
          4. if those controls are not exposed, captures the ATLauncher window to a **temporary PNG**, uses window-relative fallback positions calibrated from the reference screenshots, then deletes the PNG immediately;
          5. waits for the real Minecraft Java process (`javaw.exe` / `java.exe`) and watches that process for crashes instead of watching the launcher.

          The Minecraft preset switches keyboard + mouse to **Global** because the launcher executable is not the game window.

          ## Reference screenshots

          - [ATLauncher News page](./minecraft-atlauncher/01-news.png)
          - [Instances tab selected](./minecraft-atlauncher/02-instances-selected.png)
          - [Instances tab normal](./minecraft-atlauncher/03-instances-normal.png)
          - [ATLauncher Instances page](./minecraft-atlauncher/04-instances-page.png)
          - [Play button](./minecraft-atlauncher/05-play.png)

          These images are repository references. Screenshots captured on a user's PC during fallback are temporary and are not saved in the repository or user data folder.
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          PY

          cat > src/tests/minecraft-launcher.test.js <<'EOF'
          'use strict';

          const test = require('node:test');
          const assert = require('node:assert');
          const launcher = require('../utils/minecraft-launcher');
          const jogo = require('../utils/jogo');
          const mouse = require('../controllers/mouse');

          test('ATLauncher: detecta caminho real sem confundir launcher comum', () => {
            assert.strictEqual(launcher.ehAtLauncher('C:\\Users\\Admin\\AppData\\Roaming\\ATLauncher\\ATLauncher.exe'), true);
            assert.strictEqual(launcher.ehAtLauncher('C:\\Apps\\ATLauncher-3.exe'), true);
            assert.strictEqual(launcher.ehAtLauncher('C:\\Apps\\PrismLauncher.exe'), false);
          });

          test('ATLauncher: fallback usa coordenadas calibradas das referências', () => {
            assert.deepStrictEqual(launcher.coordenadaFallback('instances', 1188, 696), { x: 1107, y: 239 });
            assert.deepStrictEqual(launcher.coordenadaFallback('play', 1187, 696), { x: 427, y: 399 });
          });

          test('ATLauncher: prioriza UI Automation, captura fallback e apaga screenshot temporária', () => {
            const s = launcher.montarScriptAtLauncher('C:\\ATLauncher\\ATLauncher.exe', 'C:\\Temp\\cp-shot.png');
            assert.match(s, /UIAutomationClient/);
            assert.match(s, /Find-ByName \$root 'Instances'/);
            assert.match(s, /Find-ByName \$root 'Play'/);
            assert.match(s, /CopyFromScreen/);
            assert.match(s, /0\.932 0\.343/);
            assert.match(s, /0\.360 0\.573/);
            assert.match(s, /finally \{[\s\S]*Remove-Item -LiteralPath \$shot -Force/);
          });

          test('gerenciador: launcher customizado não vira falso Minecraft rodando', async () => {
            jogo.__resetTeste();
            let lancamentos = 0;
            try {
              jogo.configurar({
                exe: 'C:\\ATLauncher\\ATLauncher.exe',
                detector: async () => false,
                lancador: async () => { lancamentos++; return true; },
                startupGraceMs: 30000,
                nomeGerenciado: 'Minecraft',
                autoReiniciar: false,
              });
              const r = await jogo.iniciar();
              assert.strictEqual(r.ok, true);
              assert.strictEqual(r.modo, 'launcher');
              assert.strictEqual(lancamentos, 1);
              assert.strictEqual(jogo.status().nome, 'Minecraft');
              assert.strictEqual(jogo.status().rodando, false);
            } finally {
              jogo.__resetTeste();
            }
          });

          test('gerenciador: Minecraft já rodando anexa sem clicar Play', async () => {
            jogo.__resetTeste();
            let lancamentos = 0;
            try {
              jogo.configurar({
                exe: 'C:\\ATLauncher\\ATLauncher.exe',
                detector: async () => true,
                lancador: async () => { lancamentos++; return true; },
                nomeGerenciado: 'Minecraft',
              });
              const r = await jogo.iniciar();
              assert.strictEqual(r.ok, true);
              assert.strictEqual(r.modo, 'anexar');
              assert.strictEqual(lancamentos, 0);
            } finally {
              jogo.__resetTeste();
            }
          });

          test('mouse global: opera sem EMULADOR_EXE usando a janela em foco', () => {
            const antes = mouse.status();
            const linhas = [];
            try {
              mouse.configurar({ modo: 'global', alvoExe: null, passoPx: 40 });
              mouse.__test.simular({ plataforma: 'win32', linhas });
              assert.strictEqual(mouse.mover(1, 0), true);
              assert.deepStrictEqual(linhas, ['MG 40 0']);
              const fonte = mouse.__test.fonteWorker();
              assert.match(fonte, /GetForegroundWindow/);
              assert.match(fonte, /GetArea\(out hwnd, out rect, out origin, true\)/);
            } finally {
              mouse.__test.restaurar();
              mouse.configurar({ modo: antes.modo, alvoExe: antes.alvoExe, passoPx: antes.passoPx });
            }
          });
          EOF

      - name: Install and validate
        run: |
          npm ci
          npm test
          npm audit --audit-level=high

      - name: Commit clean feature result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-minecraft-launcher-automation.py
          rm -f .github/workflows/implement-minecraft-launcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: automate Minecraft launch through ATLauncher"
          git push origin HEAD:feat/minecraft-launcher-automation
