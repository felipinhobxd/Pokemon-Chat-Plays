name: Implement Minecraft launcher automation

on:
  push:
    branches:
      - feat/minecraft-launcher-automation
    paths:
      - .github/workflows/implement-minecraft-launcher.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm

      - name: Apply integration patch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/patch-minecraft-launcher-automation.py /tmp/patch-minecraft-launcher.py
          python3 /tmp/patch-minecraft-launcher.py

      - name: Install and validate
        run: |
          npm ci
          npm test
          npm audit --audit-level=high

      - name: Commit clean feature result
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-minecraft-launcher-automation.py
          rm -f .github/workflows/implement-minecraft-launcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: automate Minecraft launch through ATLauncher"
          git push origin HEAD:feat/minecraft-launcher-automation
