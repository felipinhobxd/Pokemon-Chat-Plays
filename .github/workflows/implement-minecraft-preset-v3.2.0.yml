name: Implement Minecraft preset v3.2.0

on:
  push:
    branches:
      - feat/minecraft-preset-v3.2.0
    paths:
      - .github/workflows/implement-minecraft-preset-v3.2.0.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: npm

      - name: Verify base and apply patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="6a1caa0bb7cbbf30ae1c89bcd7fa8fe224fd8dae"
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN"
          python3 scripts/patch-minecraft-v3.2.0.py
          npm version 3.2.0 --no-git-tag-version
          rm -f scripts/patch-minecraft-v3.2.0.py
          rm -f .github/workflows/implement-minecraft-preset-v3.2.0.yml

      - name: Install and validate
        run: |
          npm ci
          npm test
          npm audit --audit-level=high

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Minecraft controls preset"
          git push origin HEAD:main

      - name: Remove temporary branch
        if: success()
        shell: bash
        run: git push origin --delete feat/minecraft-preset-v3.2.0 || true
