name: Fix ATLauncher preset gate

on:
  push:
    branches: ["fix/atlauncher-preset-gate"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atlauncher-preset-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fix
        run: python3 scripts/fix-atlauncher-preset-gate.py
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Audit
        run: npm audit --audit-level=high
      - name: Commit clean result
        run: |
          rm -f .github/workflows/fix-atlauncher-preset-gate.yml scripts/fix-atlauncher-preset-gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: treat ATLauncher as Minecraft launcher by path"
          git push origin HEAD:fix/atlauncher-preset-gate
