name: Fix running picker workflow

on:
  push:
    branches: [feat/select-running-game]
    paths:
      - .github/workflows/finalize-running-game-picker.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/select-running-game
          fetch-depth: 0
      - name: Fix generated test preamble
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/implement-running-game-picker.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          found = False
          for i, line in enumerate(lines):
              if "assistente-apps-abertos.test.js').write_text(" in line:
                  lines[i] = line.rstrip('\\')
                  found = True
                  break
          if not found:
              raise SystemExit('test writer line not found')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-running-game-picker.yml
      - name: Commit workflow fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix running picker validation"
          git push origin HEAD:feat/select-running-game
