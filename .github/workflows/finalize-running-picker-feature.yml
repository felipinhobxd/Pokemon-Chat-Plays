name: Finalize running game picker feature

on:
  push:
    branches: [feat/select-running-game]
    paths:
      - .github/workflows/finalize-running-picker-feature.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/select-running-game
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm
      - name: Apply feature patch from validated implementation workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/implement-running-game-picker.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-running-picker.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-running-picker.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/tests/assistente-apps-abertos.test.js')
          s = p.read_text(encoding='utf-8')
          if s.startswith('\\\n'):
              s = s[2:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
      - name: Commit only feature files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/assistente.js src/assistente-pagina.js src/tests/assistente-apps-abertos.test.js
          git commit -m "feat: select an already running game in setup"
          git push origin HEAD:feat/select-running-game
